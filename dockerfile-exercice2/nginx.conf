# nginx.conf — configuration minimale pour quiz-docker:secure
# Sert des fichiers statiques sur le port 8080 en tant que utilisateur non-root.

worker_processes  auto;

# Logs vers stdout/stderr (collectés nativement par Docker)
error_log  /dev/stderr  warn;
pid        /run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Journalisation vers stdout
    access_log  /dev/stdout;

    sendfile        on;
    keepalive_timeout  65;

    # En-têtes de sécurité HTTP
    add_header X-Frame-Options           "SAMEORIGIN"           always;
    add_header X-Content-Type-Options    "nosniff"              always;
    add_header X-XSS-Protection          "1; mode=block"        always;
    add_header Referrer-Policy           "no-referrer"          always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;

    # Masque la version nginx dans les réponses d'erreur et l'en-tête Server
    server_tokens off;

    server {
        listen       8080;
        listen  [::]:8080;
        server_name  localhost;

        root   /usr/share/nginx/html;
        index  index.html;

        # SPA fallback : toutes les routes renvoient index.html
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Compression gzip pour les assets statiques
        gzip            on;
        gzip_types      text/plain text/css application/javascript application/json;
        gzip_min_length 1000;

        # Cache des assets Vite (hachés) : 1 an
        location ~* \.(js|css|png|jpg|jpeg|svg|ico|woff2?)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Interdit l'accès aux fichiers cachés (.htaccess, etc.)
        location ~ /\. {
            deny all;
        }

        # Page d'erreur personnalisée
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   /usr/share/nginx/html;
        }
    }
}
